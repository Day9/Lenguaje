{% extends 'base.html' %}
{% block content %}
<div class="admin-card">
    <div class="admin-header">
        <div style="display:flex;align-items:center;">
            <a class="back-link" href="{% url 'admin_specialists_list' %}">←</a>
            <h2 class="admin-title" style="font-size:1.25rem;">Eliminar Especialista</h2>
        </div>
    </div>
    <div style="margin-top:12px;">
        <p class="admin-subtle">¿Confirmas eliminar a <strong>{{ specialist.name }}</strong>?</p>
        <form method="post" style="margin-top:12px;">
            {% csrf_token %}
            <button type="submit" class="btn-danger">Confirmar eliminación</button>
            <a href="{% url 'admin_specialists_list' %}" style="margin-left:12px;color:#4a5568;">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}

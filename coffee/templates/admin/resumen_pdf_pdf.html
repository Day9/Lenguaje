<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Resumen de Reservas - PDF</title>
    <style>
      body { font-family: Arial, sans-serif; color:#0f4c5c; }
      .box { background:#fff; padding:12px; border:1px solid #e6f3fb; border-radius:6px; margin-bottom:10px }
      .title { font-size:18px; font-weight:700; margin-bottom:8px }
      .small { color:#4a5568; font-size:12px }
      table { width:100%; border-collapse:collapse; margin-top:8px }
      th, td { padding:6px; border-top:1px solid #eef6fb; text-align:left }
      img { max-width:100%; height:auto }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="title">Resumen de Reservas</div>
      {% for c in conteos %}
        <div style="display:inline-block;margin-right:12px;padding:6px 10px;border-radius:6px;background:#f4fbff;">{{ c.estado }}: <strong>{{ c.total }}</strong></div>
      {% endfor %}
    </div>

    {% if chart_base64 %}
      <div class="box">
        <div class="title">Gráfica: Reservas por fecha</div>
        <img src="data:image/png;base64,{{ chart_base64 }}" alt="chart" />
      </div>
    {% endif %}

    {% if reservas_por_fecha %}
      <div class="box">
        <div class="title">Detalle por fecha</div>
        <table>
          <thead><tr><th>Fecha</th><th>Reservas</th></tr></thead>
          <tbody>
            {% for r in reservas_por_fecha %}
              <tr><td>{{ r.fecha }}</td><td>{{ r.total }}</td></tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    {% endif %}
  </body>
</html>

{% extends 'base.html' %}
{% block content %}
<div class="admin-card">
    <div class="admin-header">
        <div style="display:flex;align-items:center;">
            <a class="back-link" href="{% url 'admin_dashboard' %}">←</a>
            <h2 class="admin-title" style="font-size:1.2rem;">Especialistas</h2>
        </div>
        <div class="admin-actions">
            <a class="btn-primary" href="{% url 'admin_specialist_create' %}">Agregar especialista</a>
        </div>
    </div>
    <div>
    {% for s in specialists %}
        <div class="admin-list-row" style="align-items:center;gap:12px;">
            <div style="display:flex;gap:12px;align-items:center;">
                <div>
                    <strong>{{ s.name }}</strong>
                    <div class="admin-subtle">{{ s.email }} — {% if s.available %}Disponible{% else %}No disponible{% endif %}</div>
                </div>
            </div>
            <div>
                <a class="btn-outline" href="{% url 'admin_specialist_edit' s.id %}">Editar</a>
                <a class="btn-danger" href="{% url 'admin_specialist_delete' s.id %}">Eliminar</a>
            </div>
        </div>
    {% empty %}
        <div>No hay especialistas.</div>
    {% endfor %}
    </div>
</div>
{% endblock %}

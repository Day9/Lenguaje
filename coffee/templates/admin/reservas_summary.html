{% extends 'base.html' %}
{% block content %}
<div class="admin-card">
  <div class="admin-header">
    <div style="display:flex;align-items:center;">
      <a class="back-link" href="{% url 'admin_dashboard' %}">←</a>
      <h2 class="admin-title" style="font-size:1.3rem;">Resumen de Reservas</h2>
    </div>
    <div class="admin-actions">
      <a class="btn-primary" href="{% url 'admin_resumen_pdf' %}">Exportar PDF</a>
    </div>
  </div>

  <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;">
    {% for c in conteos %}
      <div style="background:#ffffff;border:1px solid #e6f3fb;padding:14px;border-radius:10px;min-width:160px;">
        <div style="font-size:0.9rem;color:#4a5568;">{{ c.estado }}</div>
        <div style="font-size:1.8rem;color:#0f4c5c;font-weight:700;margin-top:6px;">{{ c.total }}</div>
      </div>
    {% empty %}
      <div class="admin-subtle">No hay reservas registradas.</div>
    {% endfor %}
  </div>
</div>
{% endblock %}

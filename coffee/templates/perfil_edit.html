{% extends 'base.html' %}
{% block content %}
<div style="max-width:800px;margin:100px auto;padding:30px;background:white;border-radius:20px;box-shadow:0 12px 30px rgba(0,0,0,0.06);">
  <h2 style="color:var(--rain-boots);font-family:'Playfair Display', serif;">Editar Perfil</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="background:var(--rain-boots);color:white;padding:10px 18px;border-radius:10px;border:none;">Guardar</button>
    <a href="{% url 'perfil' %}" style="margin-left:10px;color:#4a5568;">Cancelar</a>
  </form>
</div>
{% endblock %}

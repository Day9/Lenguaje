{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    .sirene-contact-split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 60px;
        align-items: center;
        max-width: 1200px;
        margin: 80px auto;
        padding: 0 40px;
    }

    .contact-title {
        color: #0f4c5c;
        font-family: 'Playfair Display', serif;
        font-size: 3rem;
        margin-bottom: 20px;
    }

    .contact-description {
        color: #4a5568;
        line-height: 1.6;
        margin-bottom: 30px;
    }

    .info-channel-node h3 {
        color: #1e6fb8; 
        text-transform: uppercase;
        letter-spacing: 2px;
        font-size: 0.8rem;
        margin-bottom: 5px;
    }

    .info-channel-node p {
        color: #0f4c5c;
        font-size: 1.1rem;
        font-weight: 500;
        margin-bottom: 20px;
    }

    /* Estilo para el contenedor de la imagen */
    .contact-image-block img {
        width: 100%;
        height: 500px;
        object-fit: cover;
        border-radius: 30px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        display: block;
    }
</style>

<section class="sirene-contact-split">
    <!-- Bloque de Texto -->
    <div class="contact-text-block">
        <h2 class="contact-title">CONTÁCTANOS</h2>
        <p class="contact-description">
            Ofrecemos distintas opciones de tratamientos exclusivos pensados para ti. 
            Contáctanos para adaptar la experiencia a tu ritmo.
        </p>
        <div class="contact-info-channels">
            <div class="info-channel-node">
                <h3>Teléfono</h3>
                <p>+58 412-4008-115</p>
            </div>
            <div class="info-channel-node">
                <h3>Email</h3>
                <p>spa.sirene20@gmail.com</p>
            </div>
            <div class="info-channel-node">
    <h3>Social</h3>
    <div style="display: flex; gap: 20px; margin-top: 5px;">
        <a href="https://instagram.com" target="_blank" style="color: #07707D; font-size: 1.5rem;">
            <i class="fab fa-instagram"></i>
        </a>
        <a href="https://tiktok.com" target="_blank" style="color: #07707D; font-size: 1.5rem;">
            <i class="fab fa-tiktok"></i>
        </a>
        <a href="https://facebook.com" target="_blank" style="color: #07707D; font-size: 1.5rem;">
            <i class="fab fa-facebook-f"></i>
        </a>
    </div>
</div>
        </div>
    </div>
    
    <!-- Bloque de Imagen con peli.jpg -->
    <div class="contact-image-block">
    <img src="{% static 'peli.jpg' %}" alt="Ambiente Sirene" 
    style="width: 100%; height: 500px; object-fit: cover; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); display: block;">
</div>
</section>
{% endblock %}

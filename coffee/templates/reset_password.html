{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="register-page">
    <div class="bg-overlay"></div>

    <div class="auth-card">
        <h1>Restablecer Contraseña</h1>
        
        <p style="color: #667085; font-size: 0.9rem; text-align: center; margin-bottom: 1.5rem; line-height: 1.4;">
            ¿Olvidaste tu contraseña? Introduce tu correo electrónico y te enviaremos las instrucciones para configurar una nueva.
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="input-container">
                <input type="email" name="email" required autocomplete="off">
                <label>Correo electrónico</label>
                <span class="line"></span>
            </div>

            <input type="submit" value="Enviar instrucciones" class="submit-btn" style="margin-top: 1rem;">
            
            <div class="footer-link" style="margin-top: 1.5rem;">
                <a href="{% url 'login' %}">Volver al Inicio de Sesión</a>
            </div>
        </form>
    </div>
</body>
</html>

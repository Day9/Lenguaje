{% extends 'base.html' %}

{% block content %}
<section style="min-height: calc(100vh - 100px); display: flex; align-items: center; justify-content: center; padding: 3rem 1rem;">
    <div style="width: min(560px, 100%); background: white; border-radius: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.08); padding: 3rem;">
        <h1 style="font-family: 'Playfair Display', serif; font-size: 2rem; color: #2C3E50; margin-bottom: 1rem;">Restablecer contraseña</h1>
        <p style="color: #667085; margin-bottom: 1.8rem;">Ingresa tu correo y recibirás instrucciones para recuperar el acceso.</p>
        <form method="POST">
            {% csrf_token %}
            <label style="display:block; margin-bottom: 0.75rem; color:#7c8a97; text-transform: uppercase; letter-spacing:1px; font-size:0.75rem;">Correo electrónico</label>
            <input type="email" name="email" required style="width:100%; padding:1rem 1.2rem; border-radius:18px; border:1px solid #e6e4e1; margin-bottom:1.5rem; background:#fbfbfb;">
            <button type="submit" style="width:100%; border:none; border-radius:999px; padding:1rem; background:#334B64; color:white; font-weight:600; text-transform:uppercase; letter-spacing:1px; cursor:pointer;">Enviar enlace</button>
        </form>
    </div>
</section>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<section style="min-height: calc(100vh - 100px); display: flex; align-items: center; justify-content: center; padding: 3rem 1rem;">
    <div style="width: min(560px, 100%); background: white; border-radius: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.08); padding: 3rem; text-align: center;">
        <h1 style="font-family: 'Playfair Display', serif; font-size: 2rem; color: #2C3E50; margin-bottom: 1rem;">Restablecimiento completo</h1>
        <p style="color: #667085; margin-bottom: 1.5rem;">Tu contraseña ha sido actualizada exitosamente.</p>
        <a href="{% url 'login' %}" style="display:inline-block; padding:1rem 2rem; background:#334B64; color:white; border-radius:999px; text-decoration:none; text-transform:uppercase; letter-spacing:1px;">Iniciar sesión</a>
    </div>
</section>
{% endblock %}

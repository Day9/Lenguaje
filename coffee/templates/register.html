{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="register-page">
    <div class="bg-overlay"></div>

    <div class="auth-card">
    <h1>Registrate</h1>

    {% if messages %}
    <div class="messages-container">
    {% for message in messages %}
            {% if message.tags == 'error' %}
                <p class="msg-error">{{ message }}</p>
            {% else %}
                <p class="msg-success">{{ message }}</p>
            {% endif %}
        {% endfor %}
        </div>
    {% endif %}
        
    <form method="POST">
        {% csrf_token %}

        <div class="name-row">
            <div class="input-container">
            <input type="text" name="first_name" required value="{{ first_name|default:'' }}">
            <label>Nombre</label>
            <span class="line"></span>
        </div>

            <div class="input-container">
                <input type="text" name="last_name" required value="{{ last_name|default:'' }}">
                <label>Apellido</label>
                <span class="line"></span>
            </div>
        </div>

        <div class="input-container">
        <input type="text" name="username" required value="{{ username|default:'' }}">
        <label>Nombre de usuario</label>
        <span class="line"></span>
        </div>

        <div class="input-container">
            <input type="email" name="email" required value="{{ email|default:'' }}">
            <label>Correo electrónico</label>
            <span class="line"></span>
        </div>

        <div class="input-container">
        <input type="password" name="password" required>
        <label>Contraseña</label>
        <span class="line"></span>
        </div>    

        <input type="submit" value="Crear cuenta" class="submit-btn">
        
        <div class="footer-link">
        ¿Ya tienes una cuenta? <a href="{% url 'login' %}">Login</a>
        </div>
    </form>
    </div>
</body>
</html>
